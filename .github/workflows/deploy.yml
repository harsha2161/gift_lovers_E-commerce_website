name: Deploy React and Node to EC2

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy Full Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
        
            cd /home/ubuntu/gift_lovers_E-commerce_website
            git pull origin main

    
            cd backend
            npm install
            pm2 restart gift-lovers-backend

            cd ../frontend
            npm install
            npm run build